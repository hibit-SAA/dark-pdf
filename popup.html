<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>深色 PDF 阅读器</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h4"/>
      </svg>
    </span>
    <div>
      <h1>深色 PDF 阅读器</h1>
      <p class="sub">文档反色 · 整页深色</p>
    </div>
  </header>

  <div class="row">
    <div class="row-text">
      <span class="label">自动接管 PDF 链接</span>
      <span class="hint">打开 .pdf 链接时直接进深色阅读器</span>
    </div>
    <label class="switch">
      <input id="auto" type="checkbox" checked>
      <span class="track"><span class="thumb"></span></span>
    </label>
  </div>

  <div class="row">
    <div class="row-text">
      <span class="label">默认反色</span>
      <span class="hint">进入阅读器时自动反色</span>
    </div>
    <label class="switch">
      <input id="invert" type="checkbox" checked>
      <span class="track"><span class="thumb"></span></span>
    </label>
  </div>

  <div class="row column">
    <div class="row-text spread">
      <span class="label">反色强度</span>
      <span id="strengthVal" class="value">92%</span>
    </div>
    <input id="strength" class="range" type="range" min="50" max="100" step="1" value="92">
    <p class="hint">越高越黑，100% 为完全反色</p>
  </div>

  <button id="open" class="primary">用深色打开当前页</button>
  <p id="status" class="status"></p>

  <footer class="foot">
    本地 PDF 需在 <code>edge://extensions</code> 中打开「允许访问文件 URL」
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
